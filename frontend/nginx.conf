server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns its routes: any unknown path returns index.html so a deep link survives a reload
    # (docs/ui-design.md §2, docs/architecture.md §6.2).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The SPA and the API share an origin here, which is why environment.ts can use the relative
    # base '/api/v1'. CORS still exists in the API for `ng serve` in development.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
